services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nonglink-agent-backend:latest
    container_name: nonglink-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - DATA_DIR=/data
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - nonglink_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://127.0.0.1:8000
    image: nonglink-agent-frontend:latest
    container_name: nonglink-frontend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nonglink_data:
    name: nonglink_agent_data
